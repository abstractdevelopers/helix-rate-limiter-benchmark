version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - CONFIG_PATH=api/config.json
      - PORT=8080
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data: